<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" aria-hidden="true">
  <defs>
    <linearGradient id="al-fus" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.28" stop-color="#eef3f8"/>
      <stop offset="0.55" stop-color="#d5e0ea"/>
      <stop offset="0.78" stop-color="#a9bfd2"/>
      <stop offset="1" stop-color="#6f8aa6"/>
    </linearGradient>
    <linearGradient id="al-nose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6fafd"/>
      <stop offset="0.5" stop-color="#cddae6"/>
      <stop offset="1" stop-color="#7c93ae"/>
    </linearGradient>
    <linearGradient id="al-wing" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#f2f6fa"/>
      <stop offset="0.5" stop-color="#c3d2e0"/>
      <stop offset="1" stop-color="#709ec6"/>
    </linearGradient>
    <linearGradient id="al-fin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2b52"/>
      <stop offset="0.55" stop-color="#1e4a7a"/>
      <stop offset="1" stop-color="#35719f"/>
    </linearGradient>
    <linearGradient id="al-nacelle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#dde6ee"/>
      <stop offset="1" stop-color="#8fa7bd"/>
    </linearGradient>
    <linearGradient id="al-stab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef4f9"/>
      <stop offset="0.5" stop-color="#c3d2e0"/>
      <stop offset="1" stop-color="#7b93ad"/>
    </linearGradient>
    <filter id="al-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="al-soft5" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="al-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- Soft ambient shadow under the fuselage -->
  <ellipse cx="480" cy="176" rx="300" ry="16" fill="#1b3352" opacity="0.35" filter="url(#al-shadow)"/>

  <!-- Far-side horizontal stabilizer (behind fuselage) -->
  <path d="M150 94 L64 85 C60 85 58 90 62 93 L146 102 Z" fill="#5f7893" opacity="0.6"/>

  <!-- Vertical tail fin -->
  <path d="M158 88 L102 94 C99 86 112 60 146 47 L188 42 L226 55 C212 72 204 82 198 88 Z" fill="url(#al-fin)"/>
  <path d="M158 88 L102 94 C104 88 112 84 124 82 L150 84 Z" fill="#ffffff" opacity="0.35"/>

  <!-- Near-side horizontal stabilizer (tail plane) -->
  <path d="M120 142 L270 139 L270 125 L120 127 Z" fill="url(#al-stab)"/>
  <path d="M132 140 L216 139" stroke="#7b93ad" stroke-width="1.5" opacity="0.6"/>

  <!-- Fuselage -->
  <path d="M96 122 C96 94 130 86 200 86 L700 86 C792 86 848 95 861 122 C848 142 792 158 700 158 L200 158 C130 158 96 150 96 122 Z" fill="url(#al-fus)"/>

  <!-- Upper fuselage highlight streak -->
  <rect x="228" y="94" width="500" height="9" rx="4.5" fill="#ffffff" opacity="0.85" filter="url(#al-soft)"/>
  <rect x="228" y="94" width="500" height="6" rx="3" fill="#ffffff" opacity="0.9"/>

  <!-- Belly shading -->
  <path d="M210 150 C420 158 640 156 700 150 C640 162 420 164 210 158 Z" fill="#3a4f6d" opacity="0.4" filter="url(#al-soft5)"/>

  <!-- Nose radome -->
  <path d="M700 86 L736 86 C818 90 856 104 862 122 C856 140 818 156 736 158 L700 158 Z" fill="url(#al-nose)"/>
  <path d="M738 90 C814 94 852 107 858 122" stroke="#ffffff" stroke-width="5" fill="none" opacity="0.5" filter="url(#al-soft)"/>

  <!-- Cockpit windows -->
  <path d="M772 99 C798 92 826 96 839 106 C826 111 790 115 764 111 Z" fill="#0e2342" opacity="0.95"/>
  <path d="M772 99 C798 92 826 96 839 106 C826 101 796 96 774 96 Z" fill="#9fc3e6" opacity="0.5"/>

  <!-- Passenger window row -->
  <g fill="#4a6a8a" opacity="0.6">
    <rect x="300" y="98" width="6" height="9" rx="3"/>
    <rect x="346" y="98" width="6" height="9" rx="3"/>
    <rect x="392" y="98" width="6" height="9" rx="3"/>
    <rect x="438" y="98" width="6" height="9" rx="3"/>
    <rect x="484" y="98" width="6" height="9" rx="3"/>
    <rect x="530" y="98" width="6" height="9" rx="3"/>
    <rect x="576" y="98" width="6" height="9" rx="3"/>
    <rect x="622" y="98" width="6" height="9" rx="3"/>
    <rect x="668" y="98" width="6" height="9" rx="3"/>
    <rect x="712" y="98" width="6" height="9" rx="3"/>
  </g>

  <!-- Far engine nacelle hint -->
  <ellipse cx="392" cy="150" rx="20" ry="14" fill="#5f7893" opacity="0.55"/>

  <!-- Near-side swept wing -->
  <path d="M350 104 L600 184 C614 175 620 164 616 155 L600 146 C520 148 470 146 452 141 L444 104 Z" fill="url(#al-wing)"/>
  <path d="M354 106 L590 180" stroke="#ffffff" stroke-width="2.5" opacity="0.6"/>
  <path d="M460 137 L576 159 C574 152 560 145 540 141 L450 132 Z" fill="#4a6a8a" opacity="0.35"/>
  <path d="M444 104 L446 141" stroke="#2c4a6b" stroke-width="2" opacity="0.5"/>

  <!-- Wing-fuselage fairing -->
  <path d="M348 106 C430 120 470 126 452 138 C430 132 396 120 350 112 Z" fill="#d5e0ea" opacity="0.7"/>

  <!-- Engine pylon -->
  <path d="M466 146 L510 146 L496 154 L482 154 Z" fill="#a9bbcd"/>

  <!-- Engine nacelle -->
  <rect x="458" y="152" width="58" height="46" rx="9" fill="url(#al-nacelle)"/>
  <rect x="458" y="154" width="58" height="10" rx="5" fill="#ffffff" opacity="0.55"/>
  <ellipse cx="516" cy="176" rx="7" ry="20" fill="#12263f"/>
  <ellipse cx="516" cy="176" rx="3.5" ry="14" fill="#7d91a6" opacity="0.75"/>
  <ellipse cx="514" cy="176" rx="2" ry="6" fill="#e6eef5" opacity="0.5"/>
  <ellipse cx="458" cy="176" rx="5" ry="19" fill="#33465e" opacity="0.85"/>

  <!-- Tail cone light -->
  <ellipse cx="99" cy="124" rx="5" ry="8" fill="#d4af37" opacity="0.9"/>
  <ellipse cx="99" cy="124" rx="2.5" ry="5" fill="#fff1a8" opacity="0.9"/>
</svg>